# Secret scan on every push and pull request (dahlface-systems rule: no secrets in git).
# Same gitleaks version as the mini's pre-commit hook; known harmless matches live in .gitleaksignore.
name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          V: 8.30.1
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" sums.txt | awk '{print $1"  gl.tgz"}' | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner
